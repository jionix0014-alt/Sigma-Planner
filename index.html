<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIGMA PLANNER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top"><h1>SIGMA<span>.</span>PLANNER</h1><div><button class="ib" id="th" aria-label="Toggle theme">◐</button> <button class="ib" id="today">TODAY</button></div></div>
  <div class="top" style="margin:0"><button class="ib" id="prev" aria-label="Previous day">‹</button>
    <div class="date"><b id="dl"></b><span id="ds"></span></div>
    <button class="ib" id="next" aria-label="Next day">›</button></div>
  <div class="week" id="week"></div>
  <div class="card quote"><span id="q"></span><small id="qs"></small></div>
  <div class="card"><h2>Discipline score</h2>
    <div class="score"><b id="pc">0%</b><span id="rk">Rookie</span></div>
    <div class="bar"><i id="pb"></i></div><div class="stat" id="pt"></div></div>
  <div class="tabs">
    <button class="tab on" data-t="a">MISSIONS</button>
    <button class="tab" data-t="b">DEEN</button>
    <button class="tab" data-t="c">MINDSET</button>
  </div>

  <section id="sa">
    <div class="card"><h2>New mission</h2>
      <div class="add">
        <input type="text" id="nt" placeholder="What gets done today?" maxlength="120">
        <input type="time" id="ntm" aria-label="Time">
        <select id="np" aria-label="Priority"><option value="h">Critical</option><option value="m" selected>Important</option><option value="l">Routine</option></select>
        <button class="go" id="ad">ADD</button>
      </div></div>
    <div class="card"><h2>Today’s missions</h2><ul id="list"></ul></div>
    <div class="card"><h2>Daily log</h2><textarea id="nn" placeholder="Notes, ideas, lessons learned..."></textarea></div>
  </section>

  <section id="sb" class="hide">
    <div class="card"><h2>Five daily prayers</h2><ul id="pl"></ul></div>
    <div class="card"><h2>Extra worship</h2><ul id="xl"></ul></div>
    <div class="card"><h2>Quran recitation</h2>
      <div class="row"><input type="number" id="qp" min="0" max="999" inputmode="numeric"> <span>pages / verses read</span></div></div>
  </section>

  <section id="sc" class="hide">
    <div class="card"><h2>Energy level</h2><div class="moods" id="md"></div></div>
    <div class="card"><h2>Intention</h2>
      <textarea id="in" placeholder="What will I conquer today?"></textarea>
      <label class="l">Gratitude</label>
      <textarea id="gr" placeholder="Three things I am grateful for..."></textarea></div>
    <div class="card"><h2>My code (custom habits)</h2>
      <div class="add" style="margin-bottom:8px"><input type="text" id="nh" placeholder="e.g. Gym, Cold shower, Read 10 pages" maxlength="60" style="flex:1"><button class="go" id="ah">ADD</button></div>
      <ul id="hl"></ul></div>
  </section>
</div>
<script src="script.js"></script>
</body>
</html>
